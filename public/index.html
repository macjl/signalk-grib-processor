<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GRIB Processor</title>
<style>
  :root { color-scheme: light dark; font: 16px system-ui; }
  body { margin: 2rem auto; padding: 0 1rem; max-width: 42rem; }
  form, fieldset { display: grid; gap: .9rem; }
  label { display: grid; gap: .3rem; }
  input, select, button { font: inherit; padding: .45rem; min-width: 0; }
  fieldset { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  fieldset[hidden] { display: none; }
  .fields { grid-column: 1 / -1; }
  .fields label { display: inline-block; margin-right: 1rem; }
  #result { margin-top: 1rem; display: block; }
  #result[hidden] { display: none; }
</style>
<h1>GRIB Processor</h1>
<form id="export">
  <label>Forecast dataset <select id="dataset" required></select></label>
  <label>Operation <select id="mode">
    <option value="assemble">Assemble into one GRIB2</option>
    <option value="crop">Crop AROME 0.025° to an area</option>
  </select></label>
  <fieldset id="selection" hidden>
    <legend>Selection</legend>
    <label>West <input id="west" type="number" step="any" value="-6"></label>
    <label>East <input id="east" type="number" step="any" value="-1"></label>
    <label>South <input id="south" type="number" step="any" value="44"></label>
    <label>North <input id="north" type="number" step="any" value="48"></label>
    <label>First forecast time (UTC) <input id="from" type="datetime-local"></label>
    <label>Last forecast time (UTC) <input id="to" type="datetime-local"></label>
    <div class="fields">
      <label><input type="checkbox" name="fields" value="wind" checked> Wind at 10 m</label>
      <label><input type="checkbox" name="fields" value="pressure" checked> Mean sea-level pressure</label>
    </div>
  </fieldset>
  <button id="submit" disabled>Prepare GRIB2</button>
</form>
<p id="status" role="status" aria-live="polite"></p>
<a id="result" hidden>Download GRIB2</a>
<script type="module" src="./app.js"></script>
</html>
